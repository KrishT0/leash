  <rect width="512" height="512" rx="116" fill="#0B0B0D" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#7C5CFF" stroke-width="30" />
  <circle cx="406" cy="256" r="52" fill="#FFFFFF" />
</svg>
