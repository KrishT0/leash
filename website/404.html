<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 | Leash</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101216">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Rubik;font-style:normal;font-weight:400 900;font-display:swap;src:url("/fonts/rubik-latin.woff2") format("woff2")}
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;font-display:swap;src:url("/fonts/instrument-serif-italic-latin.woff2") format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:100 800;font-display:swap;src:url("/fonts/jetbrains-mono-latin.woff2") format("woff2")}
:root{--bg:#101216;--fg:#f3f4f6;--mute:#8b909a;--line:#2a2d34;--btn:#f3f4f6;--btn-fg:#101216}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f5f2;--fg:#121214;--mute:#6b6f76;--line:#d6d6d0;--btn:#121214;--btn-fg:#f5f5f2}}
:root[data-theme="light"]{--bg:#f5f5f2;--fg:#121214;--mute:#6b6f76;--line:#d6d6d0;--btn:#121214;--btn-fg:#f5f5f2}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:400 1.0625rem/1.6 Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.lbl{font:500 .72rem/1 "JetBrains Mono",ui-monospace,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}
header{height:48px;display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:.55rem;padding:0 1.1rem;font-weight:800;text-decoration:none;letter-spacing:-.01em}
.frame{flex:1;width:100%;max-width:960px;margin:0 auto;border-inline:1px solid var(--line);display:flex;flex-direction:column}
.bar{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;border-bottom:1px solid var(--line)}
.bar span:last-child{color:var(--mute)}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:3rem 1.5rem}
h1{font-size:clamp(2.6rem,9vw,5.4rem);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:0 0 1.5rem;max-width:14ch;animation:in .8s cubic-bezier(.2,.7,.2,1) both}
h1 em{font:italic 400 1.12em/1 "Instrument Serif",Georgia,serif;letter-spacing:-.01em}
p{color:var(--mute);font-size:1.2rem;max-width:36ch;margin:0 0 2rem}
.btn{align-self:flex-start;background:var(--btn);color:var(--btn-fg);padding:.95rem 1.4rem;text-decoration:none;font-weight:500}
.btn:hover{opacity:.86}
.foot{padding:1.25rem 1.5rem;border-top:1px solid var(--line);color:var(--mute);font-size:.9rem}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@media (max-width:600px){.btn{align-self:stretch;text-align:center}.bar span:last-child{display:none}}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
</style>
</head>
<body>
<header><a class="logo" href="/"><svg width="22" height="22" viewBox="-12 -12 24 24" aria-hidden="true"><circle r="10" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="4" cy="-3" r="3" fill="currentColor"/></svg>Leash</a></header>
<main class="frame">
<div class="bar lbl"><span>404 / Not found</span><span>Leash</span></div>
<div class="body">
<h1>That page is <em>not on</em> the list.</h1>
<p>The link may be wrong, or the page may have moved.</p>
<a class="btn lbl" href="/">Back to home</a>
</div>
<div class="foot">Built by <a href="https://github.com/KrishT0" target="_blank" rel="noopener">KrishT0</a></div>
</main>
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</body>
</html>
