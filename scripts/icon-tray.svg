<!--
  The source for the tray mark, at src-tauri/icons/tray.png. Regenerate it by
  rendering this file in Chrome, headless, on a transparent background in a 256
  by 256 window, and write the result to src-tauri/icons/tray.png.

  No tile here, and no colour of its own. The tray recolours every pixel that is
  not transparent, so the shape has to carry the meaning on its own: white is
  only a placeholder, and the app paints it green, amber or red at run time.

  The shapes are heavier than the ones in the app icon, because the tray draws
  this at 16 pixels across.

  This comment holds no double dash, because an XML comment may not contain one,
  and a double dash here would stop the file loading as an image.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="32" fill="none" stroke="#FFFFFF" stroke-width="11" />
  <circle cx="82" cy="50" r="12" fill="#FFFFFF" />
</svg>
